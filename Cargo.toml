[package]
name = "parser-2gis"
version = "0.1.0"
edition = "2024"
description = "Парсер 2GIS на Rust с фильтрами для поиска лидов"
license = "LGPL-3.0"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
chromiumoxide = "0.9.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
clap = { version = "4.6.7", features = ["derive"] }
csv = "1.4.0"
dirs = "7.0.0"
eframe = { version = "0.37.0", features = ["persistence"] }
egui_extras = "0.37.0"
encoding_rs = "0.8.44"
futures = "0.3.34"
regex = "1.13.1"
rfd = "0.17.2"
rust_xlsxwriter = "0.102.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
which = "8.0.6"

[profile.release]
lto = "thin"
strip = true
codegen-units = 4

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_System_Console"] }
